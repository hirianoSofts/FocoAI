<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FocoAI - Criar Conta</title>
    <!-- Google Fonts: DM Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="../auth/style.css">
</head>
<body class="auth-body">

    <div class="auth-container">
        <!-- Logotipo FocoAI -->
        <div class="auth-logo-wrapper">
            <img src="../../assets/logo.png" alt="FocoAI Logo" class="auth-logo">
        </div>

        <!-- Botão Voltar (Oculto na Etapa 1) -->
        <button type="button" class="auth-back-btn hidden" id="backBtn">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
            Voltar
        </button>

        <!-- Indicador de Etapas (Step Indicator) -->
        <div class="step-indicator">
            <span class="step-pill active" id="stepPill1"></span>
            <span class="step-pill" id="stepPill2"></span>
            <span class="step-pill" id="stepPill3"></span>
        </div>

        <form id="signupForm" class="auth-form" onsubmit="return false;">
            
            <!-- ETAPA 1: Inserir E-mail -->
            <div class="wizard-step step-1 active" id="step1">
                <h1 class="auth-title">Insira seu e-mail</h1>

                <div class="auth-input-group">
                    <label for="emailInput">E-mail</label>
                    <input type="email" id="emailInput" placeholder="Digite seu e-mail para começar" required>
                </div>

                <button type="button" class="auth-btn-primary" id="btnNext1">Continuar</button>

                <div class="auth-divider"><span>ou</span></div>

                <button type="button" class="auth-btn-social" id="btnGoogle">
                    <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z"/><path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.19v3.15C3.17 21.32 7.23 24 12 24z"/><path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.19C.43 8.12 0 9.87 0 12s.43 3.88 1.19 5.42l4.09-3.15z"/><path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.23 0 3.17 2.68 1.19 6.58l4.09 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/></svg>
                    Continuar com o Google
                </button>

                <button type="button" class="auth-btn-social" id="btnApple">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.89 5.37c.63-.75 1.05-1.79.94-2.83-.92.04-2.03.62-2.68 1.37-.58.67-1.09 1.74-.95 2.78 1.03.08 2.06-.51 2.69-1.32z"/></svg>
                    Continuar com a Apple
                </button>
            </div>

            <!-- ETAPA 2: Configurar Credenciais -->
            <div class="wizard-step step-2" id="step2">
                <h1 class="auth-title">Configure suas credenciais</h1>

                <div class="auth-input-group">
                    <label for="usernameInput">Nome de usuário</label>
                    <input type="text" id="usernameInput" placeholder="Ex: gpedro">
                </div>

                <div class="auth-input-group">
                    <label for="passwordInput">Senha</label>
                    <input type="password" id="passwordInput" placeholder="Mínimo 6 caracteres">
                </div>

                <div class="auth-input-group">
                    <label for="confirmPasswordInput">Confirmar senha</label>
                    <input type="password" id="confirmPasswordInput" placeholder="Confirme sua senha">
                </div>

                <button type="button" class="auth-btn-primary" id="btnNext2">Continuar</button>
            </div>

            <!-- ETAPA 3: Finalizar Conta -->
            <div class="wizard-step step-3" id="step3">
                <h1 class="auth-title">Finalize sua conta</h1>

                <div class="auth-row-inputs">
                    <div class="auth-input-group">
                        <label for="firstNameInput">Nome</label>
                        <input type="text" id="firstNameInput" placeholder="Seu nome">
                    </div>
                    <div class="auth-input-group">
                        <label for="lastNameInput">Sobrenome</label>
                        <input type="text" id="lastNameInput" placeholder="Seu sobrenome">
                    </div>
                </div>

                <div class="auth-input-group">
                    <label for="orgInput">Organização (opcional)</label>
                    <input type="text" id="orgInput" placeholder="Sua empresa ou projeto">
                </div>

                <p class="auth-terms">
                    Ao clicar em "Criar conta", você concorda com nossos <a href="#" class="auth-link">Termos de Uso</a> e reconhece que leu e entendeu nossa <a href="#" class="auth-link">Política de Privacidade</a>.
                </p>

                <button type="submit" class="auth-btn-primary" id="btnSubmit">
                    <span id="btnSubmitText">Criar conta</span>
                </button>
            </div>

        </form>

        <p class="auth-subtitle auth-footer-text">Já tem uma conta? <a href="../login/index.html" class="auth-link">Entrar</a></p>
    </div>

    <!-- Firebase Script Integrado (ES Module) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { 
            getAuth, 
            createUserWithEmailAndPassword, 
            signInWithPopup, 
            GoogleAuthProvider, 
            OAuthProvider 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getDatabase, ref, set, get } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBBw75svJV-qRwCwUxG3fBMRoFKntgf_JI",
            authDomain: "focoia.firebaseapp.com",
            databaseURL: "https://focoia-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "focoia",
            storageBucket: "focoia.firebasestorage.app",
            messagingSenderId: "192542565436",
            appId: "1:192542565436:web:06ca4ab95cec22463b0f39",
            measurementId: "G-71F3K9NX6T"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        let currentStep = 1;

        const step1 = document.getElementById('step1');
        const step2 = document.getElementById('step2');
        const step3 = document.getElementById('step3');

        const stepPill1 = document.getElementById('stepPill1');
        const stepPill2 = document.getElementById('stepPill2');
        const stepPill3 = document.getElementById('stepPill3');

        const backBtn = document.getElementById('backBtn');
        const btnNext1 = document.getElementById('btnNext1');
        const btnNext2 = document.getElementById('btnNext2');
        const btnSubmit = document.getElementById('btnSubmit');
        const btnSubmitText = document.getElementById('btnSubmitText');
        const btnGoogle = document.getElementById('btnGoogle');
        const btnApple = document.getElementById('btnApple');

        function updateStep(step) {
            currentStep = step;

            step1.classList.remove('active');
            step2.classList.remove('active');
            step3.classList.remove('active');

            stepPill1.classList.remove('active');
            stepPill2.classList.remove('active');
            stepPill3.classList.remove('active');

            if (currentStep > 1) {
                backBtn.classList.remove('hidden');
            } else {
                backBtn.classList.add('hidden');
            }

            if (currentStep === 1) {
                step1.classList.add('active');
                stepPill1.classList.add('active');
            } else if (currentStep === 2) {
                step2.classList.add('active');
                stepPill2.classList.add('active');
            } else if (currentStep === 3) {
                step3.classList.add('active');
                stepPill3.classList.add('active');
            }
        }

        btnNext1.addEventListener('click', () => {
            const email = document.getElementById('emailInput').value.trim();
            if (email) {
                updateStep(2);
            } else {
                document.getElementById('emailInput').focus();
            }
        });

        btnNext2.addEventListener('click', () => {
            const pass = document.getElementById('passwordInput').value;
            const confirmPass = document.getElementById('confirmPasswordInput').value;

            if (pass.length < 6) {
                alert('A senha deve ter pelo menos 6 caracteres.');
                return;
            }
            if (pass !== confirmPass) {
                alert('As senhas não coincidem!');
                return;
            }
            updateStep(3);
        });

        backBtn.addEventListener('click', () => {
            if (currentStep > 1) {
                updateStep(currentStep - 1);
            }
        });

        // Grava dados do usuário no Realtime Database
        async function saveUserData(uid, data) {
            await set(ref(db, 'users/' + uid), {
                ...data,
                createdAt: new Date().toISOString()
            });
        }

        function setLoading(isLoading) {
            if (isLoading) {
                btnSubmit.disabled = true;
                btnSubmitText.innerHTML = 'Criando conta...';
            } else {
                btnSubmit.disabled = false;
                btnSubmitText.innerHTML = 'Criar conta';
            }
        }

        // Submissão do Formulário Principal (Email + Senha)
        document.getElementById('signupForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('emailInput').value.trim();
            const password = document.getElementById('passwordInput').value;
            const username = document.getElementById('usernameInput').value.trim();
            const firstName = document.getElementById('firstNameInput').value.trim();
            const lastName = document.getElementById('lastNameInput').value.trim();
            const organization = document.getElementById('orgInput').value.trim();

            setLoading(true);

            try {
                const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;

                const displayName = `${firstName} ${lastName}`.trim() || username || email.split('@')[0];

                await saveUserData(user.uid, {
                    email: email,
                    username: username || email.split('@')[0],
                    firstName: firstName,
                    lastName: lastName,
                    displayName: displayName,
                    organization: organization,
                    plan: 'Pessoal · Gratuito',
                    credits: 250
                });

                window.location.href = '../../index.html';
            } catch (error) {
                console.error(error);
                alert('Erro ao criar conta: ' + error.message);
                setLoading(false);
            }
        });

        // Cadastro / Autenticação social (Google & Apple)
        async function handleSocialAuth(provider) {
            try {
                const result = await signInWithPopup(auth, provider);
                const user = result.user;

                // Extrai nome de usuário a partir do e-mail
                const defaultUsername = user.email ? user.email.split('@')[0] : 'usuario';
                const displayName = user.displayName || defaultUsername;

                // Verifica se os dados já existem no Database
                const userRef = ref(db, 'users/' + user.uid);
                const snapshot = await get(userRef);

                if (!snapshot.exists()) {
                    await saveUserData(user.uid, {
                        email: user.email,
                        username: defaultUsername,
                        displayName: displayName,
                        photoURL: user.photoURL || '',
                        plan: 'Pessoal · Gratuito',
                        credits: 250
                    });
                }

                window.location.href = '../../index.html';
            } catch (error) {
                console.error(error);
                alert('Erro no login social: ' + error.message);
            }
        }

        btnGoogle.addEventListener('click', () => handleSocialAuth(new GoogleAuthProvider()));
        btnApple.addEventListener('click', () => handleSocialAuth(new OAuthProvider('apple.com')));
    </script>
</body>
</html>
